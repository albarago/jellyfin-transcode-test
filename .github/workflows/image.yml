name: Image

# Builds ghcr.io/albarago/jellyfin-transcode-test from the transcode-test branches of the two forks.
# Run it by hand (Actions → Image → Run workflow) after pushing to either branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: albarago/jellyfin
          ref: transcode-test
          path: jellyfin
      - uses: actions/checkout@v7
        with:
          repository: albarago/jellyfin-web
          ref: transcode-test
          path: jellyfin-web
      - name: Tag with both commits
        id: tag
        run: echo "tag=$(git -C jellyfin rev-parse --short=9 HEAD)-$(git -C jellyfin-web rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/albarago/jellyfin-transcode-test:latest
            ghcr.io/albarago/jellyfin-transcode-test:${{ steps.tag.outputs.tag }}
