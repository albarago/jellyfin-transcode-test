name: Image

# Builds ghcr.io/albarago/jellyfin-transcode-test from the transcode-test branches of the two forks.
# It runs on every push to main. After pushing to either fork's branch, start it with Actions → Image → Run workflow.
# Only a run of main moves "latest"; a run of another branch publishes only its exact source and recipe tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Publishing runs one at a time in the order they started, so a run is never stopped after it moved "latest"
# but before its recipe tag and summary, and the newest queued run moves "latest" last.
concurrency:
  group: jellyfin-transcode-test-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: albarago/jellyfin
          ref: transcode-test
          path: jellyfin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: albarago/jellyfin-web
          ref: transcode-test
          path: jellyfin-web
      - name: Record the exact sources and image recipe
        id: tag
        run: |
          server_revision="$(git -C jellyfin rev-parse HEAD)"
          web_revision="$(git -C jellyfin-web rev-parse HEAD)"
          image_revision="$(git rev-parse HEAD)"
          source_tag="$(git -C jellyfin rev-parse --short=9 HEAD)-$(git -C jellyfin-web rev-parse --short=9 HEAD)"
          {
            echo "server_revision=$server_revision"
            echo "web_revision=$web_revision"
            echo "image_revision=$image_revision"
            echo "tag=$source_tag"
            echo "recipe_tag=$source_tag-$(git rev-parse --short=9 HEAD)"
            echo "tags<<EOF"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "ghcr.io/albarago/jellyfin-transcode-test:latest"
            fi
            echo "ghcr.io/albarago/jellyfin-transcode-test:$source_tag"
            echo "ghcr.io/albarago/jellyfin-transcode-test:$source_tag-$(git rev-parse --short=9 HEAD)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            SERVER_REVISION=${{ steps.tag.outputs.server_revision }}
            WEB_REVISION=${{ steps.tag.outputs.web_revision }}
            IMAGE_REVISION=${{ steps.tag.outputs.image_revision }}
          tags: ${{ steps.tag.outputs.tags }}
      - name: Record the published identity
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RECIPE_TAG: ${{ steps.tag.outputs.recipe_tag }}
          SERVER_REVISION: ${{ steps.tag.outputs.server_revision }}
          WEB_REVISION: ${{ steps.tag.outputs.web_revision }}
          IMAGE_REVISION: ${{ steps.tag.outputs.image_revision }}
        run: |
          {
            echo "### Image identity"
            echo "- Image: \`ghcr.io/albarago/jellyfin-transcode-test:$RECIPE_TAG\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Server: \`$SERVER_REVISION\`"
            echo "- Web: \`$WEB_REVISION\`"
            echo "- Image recipe: \`$IMAGE_REVISION\`"
            echo "- Pinned bases:"
            sed -n '/^ARG \(BASE_IMAGE\|NODE_IMAGE\|DOTNET_SDK_IMAGE\)=/s/^ARG /  - /p' Dockerfile
          } >> "$GITHUB_STEP_SUMMARY"
